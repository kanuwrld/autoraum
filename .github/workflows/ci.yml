name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  PUBLIC_MARKETPLACE_SEARCH: "0"

jobs:
  application:
    # Pin the OS so runner image updates do not break browser dependencies.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run privacy:check
      - run: npm run check
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:e2e

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:postgres

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --redact --no-banner

  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_URL: https://unrelated.example.test
      DATABASE_URL: postgresql://ignored@example.test/database
      ADMIN_NAME: SHELL_ONLY
      ADMIN_EMAIL: ignored@example.test
      MOBILE_API_USERNAME: SHELL_ONLY
      MOBILE_API_PASSWORD: SHELL_ONLY
      DATA_ENCRYPTION_KEY: SHELL_ONLY
      CRON_SECRET: SHELL_ONLY
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from a clean checkout using one command
        run: |
          test ! -d node_modules
          bash -n install.sh
          bash install.sh "$PWD" --port 3181
      - run: python3 tests/local-smoke.py
      - name: Stop test services
        if: always()
        env:
          APP_URL: http://localhost:3181
        run: |
          if [ -f .env.local ] && [ -d node_modules/tsx ]; then
            npm run local:service -- stop
          fi
